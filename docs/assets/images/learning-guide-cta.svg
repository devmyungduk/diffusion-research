<svg xmlns="http://www.w3.org/2000/svg" width="760" height="104" viewBox="0 0 760 104" role="img" aria-labelledby="title desc">
  <title id="title">학습 가이드 열기</title>
  <desc id="desc">검색, 목차, 단계별 실습이 포함된 온라인 학습서로 이동</desc>
  <defs>
