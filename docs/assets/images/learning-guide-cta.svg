  <text x="51" y="48" fill="#f8fafc" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="23" font-weight="700">학습 가이드 열기</text>
  <text x="51" y="73" fill="#cbd5e1" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="15">검색 · 목차 · 단계별 실습</text>
  <circle cx="704" cy="52" r="25" fill="#ffffff" fill-opacity=".11" stroke="#c4b5fd" stroke-opacity=".55"/>
  <path d="M695 52h18m-7-7 7 7-7 7" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
