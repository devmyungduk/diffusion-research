      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#28245f"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
