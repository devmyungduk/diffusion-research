<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">ComfyUI 기본 텍스트 이미지 연결도</title>
  <desc id="desc">Load Checkpoint의 MODEL, CLIP, VAE 출력과 두 프롬프트 조건, 빈 Latent가 KSampler, VAE Decode, Save Image로 연결되는 기본 워크플로우</desc>
  <defs>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#334155" opacity=".42"/>
    </pattern>
    <filter id="node-shadow" x="-15%" y="-15%" width="130%" height="145%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#020617" flood-opacity=".32"/>
    </filter>
    <style>
      .ui { font-family: Pretendard, "Noto Sans KR", "Segoe UI", Arial, sans-serif; }
      .node { fill: #151e2d; stroke: #334155; stroke-width: 1.5; }
      .header { fill: #1e293b; }
      .wire { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; opacity: .98; vector-effect: non-scaling-stroke; }
      .wire--rail { stroke-width: 3.5; opacity: .84; }
      .port-label { font-size: 12px; font-weight: 700; }
      .field { fill: #0d1524; stroke: #253247; stroke-width: 1; }
      .muted { fill: #94a3b8; }
    </style>
  </defs>

  <rect width="1440" height="640" rx="24" fill="#0b1220"/>
  <rect width="1440" height="640" rx="24" fill="url(#dots)"/>

  <g class="ui">
    <text x="40" y="42" fill="#f8fafc" font-size="25" font-weight="700">기본 Text-to-Image 연결도</text>
    <text x="40" y="70" fill="#94a3b8" font-size="15">오른쪽 출력에서 왼쪽 입력으로 연결합니다. 색은 데이터 타입, 포트 이름은 역할을 나타냅니다.</text>
  </g>

  <!-- 연결선: 출력 포트에서 입력 포트까지 정확히 이어집니다. -->
  <g id="connections">
    <path class="wire wire--rail" data-type="MODEL" data-from="checkpoint-model" data-to="ksampler-model" d="M260 285 C290 285 298 270 298 245 C298 170 285 105 335 105 C470 105 560 105 655 105 C680 105 680 125 680 150 C680 185 680 220 700 220" stroke="#B39DDB"/>
    <path class="wire" data-type="CLIP" data-from="checkpoint-clip" data-to="positive-clip" d="M260 315 C300 315 310 285 310 255 C310 215 310 185 335 185" stroke="#FFD500"/>
    <path class="wire" data-type="CLIP" data-from="checkpoint-clip" data-to="negative-clip" d="M260 315 C285 315 300 320 335 320" stroke="#FFD500"/>
    <path class="wire" data-type="CONDITIONING" data-from="positive-conditioning" data-to="ksampler-positive" d="M555 185 C620 185 630 260 700 260" stroke="#FFA931"/>
    <path class="wire" data-type="CONDITIONING" data-from="negative-conditioning" data-to="ksampler-negative" d="M555 320 C620 320 630 300 700 300" stroke="#FFA931"/>
    <path class="wire" data-type="LATENT" data-from="empty-latent" data-to="ksampler-latent" d="M555 460 C640 460 625 340 700 340" stroke="#FF9CF9"/>
    <path class="wire" data-type="LATENT" data-from="ksampler-latent-output" data-to="vae-samples" d="M950 250 C985 250 1005 250 1040 250" stroke="#FF9CF9"/>
    <path class="wire wire--rail" data-type="VAE" data-from="checkpoint-vae" data-to="vae-vae" d="M260 345 C290 345 298 360 298 385 C298 455 285 540 335 540 C560 540 795 540 985 540 C1020 540 1020 515 1020 485 C1020 405 1010 340 1040 340" stroke="#FF6E6E"/>
    <path class="wire" data-type="IMAGE" data-from="vae-image" data-to="save-images" d="M1215 295 C1235 295 1260 295 1280 295" stroke="#64B5F6"/>
  </g>

  <!-- 긴 연결은 전용 레일로 구분합니다. -->
  <g class="ui">
    <g transform="translate(455 91)" opacity=".82">
      <rect width="86" height="28" rx="14" fill="#1c1924" stroke="#5f5574"/>
      <circle cx="15" cy="14" r="5" fill="#B39DDB"/>
      <text x="28" y="19" fill="#B39DDB" font-size="12" font-weight="700">MODEL</text>
    </g>
    <g transform="translate(650 526)" opacity=".82">
      <rect width="72" height="28" rx="14" fill="#241719" stroke="#7a3b40"/>
      <circle cx="15" cy="14" r="5" fill="#FF6E6E"/>
      <text x="28" y="19" fill="#FF6E6E" font-size="12" font-weight="700">VAE</text>
    </g>
  </g>

  <!-- 노드: 중립색 카드와 타입별 상단 강조선으로 통일합니다. -->
  <g class="ui" filter="url(#node-shadow)">
    <g transform="translate(40 160)">
      <rect class="node" width="220" height="230" rx="13"/>
      <path d="M13 0H207Q220 0 220 13V44H0V13Q0 0 13 0Z" class="header"/>
      <rect width="220" height="4" rx="2" fill="#64748b"/>
      <text x="16" y="29" fill="#f8fafc" font-size="17" font-weight="700">Load Checkpoint</text>
      <text x="16" y="67" class="muted" font-size="12">ckpt_name</text>
      <rect class="field" x="14" y="78" width="192" height="34" rx="7"/>
      <text x="24" y="100" fill="#dbe4f0" font-size="12">your-model.safetensors</text>
      <text x="146" y="130" fill="#B39DDB" class="port-label">MODEL</text>
      <text x="160" y="160" fill="#FFD500" class="port-label">CLIP</text>
      <text x="166" y="190" fill="#FF6E6E" class="port-label">VAE</text>
    </g>

    <g transform="translate(335 135)">
      <rect class="node" width="220" height="100" rx="13"/>
      <path d="M13 0H207Q220 0 220 13V40H0V13Q0 0 13 0Z" class="header"/>
      <rect width="220" height="4" rx="2" fill="#64748b"/>
      <text x="15" y="27" fill="#f8fafc" font-size="15" font-weight="700">CLIP Text Encode</text>
      <rect x="157" y="13" width="49" height="18" rx="9" fill="#3b2764"/>
      <text x="181.5" y="26" text-anchor="middle" fill="#ddd6fe" font-size="9" font-weight="700">POSITIVE</text>
      <text x="15" y="55" fill="#FFD500" class="port-label">clip</text>
      <text x="111" y="55" fill="#FFA931" class="port-label">CONDITIONING</text>
      <rect class="field" x="14" y="64" width="192" height="24" rx="6"/>
      <text x="23" y="81" fill="#d8d4e7" font-size="12">원하는 장면</text>
    </g>

    <g transform="translate(335 270)">
      <rect class="node" width="220" height="100" rx="13"/>
      <path d="M13 0H207Q220 0 220 13V40H0V13Q0 0 13 0Z" class="header"/>
      <rect width="220" height="4" rx="2" fill="#64748b"/>
      <text x="15" y="27" fill="#f8fafc" font-size="15" font-weight="700">CLIP Text Encode</text>
      <rect x="153" y="13" width="53" height="18" rx="9" fill="#31234f"/>
      <text x="179.5" y="26" text-anchor="middle" fill="#ddd6fe" font-size="9" font-weight="700">NEGATIVE</text>
      <text x="15" y="55" fill="#FFD500" class="port-label">clip</text>
      <text x="111" y="55" fill="#FFA931" class="port-label">CONDITIONING</text>
      <rect class="field" x="14" y="64" width="192" height="24" rx="6"/>
      <text x="23" y="81" fill="#d8d4e7" font-size="12">피하고 싶은 특징</text>
    </g>

    <g transform="translate(335 415)">
      <rect class="node" width="220" height="90" rx="13"/>
      <path d="M13 0H207Q220 0 220 13V40H0V13Q0 0 13 0Z" class="header"/>
      <rect width="220" height="4" rx="2" fill="#64748b"/>
      <text x="15" y="27" fill="#f8fafc" font-size="15" font-weight="700">Empty Latent Image</text>
      <text x="15" y="66" fill="#cbd5e1" font-size="12">512 × 512 · batch 1</text>
      <text x="163" y="50" fill="#FF9CF9" class="port-label">LATENT</text>
    </g>

    <g transform="translate(700 165)">
      <rect class="node" width="250" height="335" rx="13" stroke="#245a78"/>
      <path d="M13 0H237Q250 0 250 13V44H0V13Q0 0 13 0Z" class="header"/>
      <rect width="250" height="4" rx="2" fill="#64748b"/>
      <text x="16" y="29" fill="#f8fafc" font-size="18" font-weight="700">KSampler</text>
      <text x="16" y="60" fill="#B39DDB" class="port-label">model</text>
      <text x="16" y="100" fill="#FFA931" class="port-label">positive</text>
      <text x="16" y="140" fill="#FFA931" class="port-label">negative</text>
      <text x="16" y="180" fill="#FF9CF9" class="port-label">latent_image</text>
      <text x="192" y="90" fill="#FF9CF9" class="port-label">LATENT</text>
      <line x1="16" y1="202" x2="234" y2="202" stroke="#334155"/>
      <text x="16" y="226" fill="#718096" font-size="10" font-weight="700" letter-spacing=".08em">SAMPLING SETTINGS</text>
      <text x="16" y="252" fill="#9bd8f4" font-size="12">seed</text><text x="118" y="252" fill="#dbe4f0" font-size="12">123456 · fixed</text>
      <text x="16" y="275" fill="#9bd8f4" font-size="12">steps</text><text x="118" y="275" fill="#dbe4f0" font-size="12">20</text>
      <text x="16" y="298" fill="#9bd8f4" font-size="12">cfg</text><text x="118" y="298" fill="#dbe4f0" font-size="12">7.0</text>
      <text x="16" y="321" fill="#9bd8f4" font-size="12">sampler · scheduler</text><text x="146" y="321" fill="#dbe4f0" font-size="12">euler · normal</text>
    </g>

    <g transform="translate(1040 190)">
      <rect class="node" width="175" height="200" rx="13"/>
      <path d="M13 0H162Q175 0 175 13V44H0V13Q0 0 13 0Z" class="header"/>
      <rect width="175" height="4" rx="2" fill="#ec4899"/>
      <text x="15" y="29" fill="#f8fafc" font-size="16" font-weight="700">VAE Decode</text>
      <text x="15" y="65" fill="#FF9CF9" class="port-label">samples</text>
      <text x="15" y="155" fill="#FF6E6E" class="port-label">vae</text>
      <text x="113" y="110" fill="#64B5F6" class="port-label">IMAGE</text>
      <text x="15" y="115" fill="#cbd5e1" font-size="12">Latent → Image</text>
    </g>

    <g transform="translate(1280 225)">
      <rect class="node" width="125" height="140" rx="13"/>
      <path d="M13 0H112Q125 0 125 13V44H0V13Q0 0 13 0Z" class="header"/>
      <rect width="125" height="4" rx="2" fill="#64748b"/>
      <text x="14" y="29" fill="#f8fafc" font-size="15" font-weight="700">Save Image</text>
      <text x="14" y="75" fill="#64B5F6" class="port-label">images</text>
      <text x="14" y="105" fill="#a5f3fc" font-size="11">미리보기 · 저장</text>
    </g>
  </g>

  <g id="ports" stroke="#0b1220" stroke-width="2.5">
    <circle id="checkpoint-model" data-type="MODEL" cx="260" cy="285" r="7" fill="#B39DDB"/>
    <circle id="checkpoint-clip" data-type="CLIP" cx="260" cy="315" r="7" fill="#FFD500"/>
    <circle id="checkpoint-vae" data-type="VAE" cx="260" cy="345" r="7" fill="#FF6E6E"/>
    <circle id="positive-clip" data-type="CLIP" cx="335" cy="185" r="7" fill="#FFD500"/>
    <circle id="positive-conditioning" data-type="CONDITIONING" cx="555" cy="185" r="7" fill="#FFA931"/>
    <circle id="negative-clip" data-type="CLIP" cx="335" cy="320" r="7" fill="#FFD500"/>
    <circle id="negative-conditioning" data-type="CONDITIONING" cx="555" cy="320" r="7" fill="#FFA931"/>
    <circle id="empty-latent" data-type="LATENT" cx="555" cy="460" r="7" fill="#FF9CF9"/>
    <circle id="ksampler-model" data-type="MODEL" cx="700" cy="220" r="7" fill="#B39DDB"/>
    <circle id="ksampler-positive" data-type="CONDITIONING" cx="700" cy="260" r="7" fill="#FFA931"/>
    <circle id="ksampler-negative" data-type="CONDITIONING" cx="700" cy="300" r="7" fill="#FFA931"/>
    <circle id="ksampler-latent" data-type="LATENT" cx="700" cy="340" r="7" fill="#FF9CF9"/>
    <circle id="ksampler-latent-output" data-type="LATENT" cx="950" cy="250" r="7" fill="#FF9CF9"/>
    <circle id="vae-samples" data-type="LATENT" cx="1040" cy="250" r="7" fill="#FF9CF9"/>
    <circle id="vae-vae" data-type="VAE" cx="1040" cy="340" r="7" fill="#FF6E6E"/>
    <circle id="vae-image" data-type="IMAGE" cx="1215" cy="295" r="7" fill="#64B5F6"/>
    <circle id="save-images" data-type="IMAGE" cx="1280" cy="295" r="7" fill="#64B5F6"/>
  </g>

  <g class="ui" transform="translate(440 596)" font-size="12">
    <circle data-type="MODEL" cx="0" cy="0" r="5" fill="#B39DDB"/><text x="12" y="4" fill="#aebdce">MODEL</text>
    <circle data-type="CLIP" cx="88" cy="0" r="5" fill="#FFD500"/><text x="100" y="4" fill="#aebdce">CLIP</text>
    <circle data-type="CONDITIONING" cx="168" cy="0" r="5" fill="#FFA931"/><text x="180" y="4" fill="#aebdce">CONDITIONING</text>
    <circle data-type="LATENT" cx="318" cy="0" r="5" fill="#FF9CF9"/><text x="330" y="4" fill="#aebdce">LATENT</text>
    <circle data-type="VAE" cx="408" cy="0" r="5" fill="#FF6E6E"/><text x="420" y="4" fill="#aebdce">VAE</text>
    <circle data-type="IMAGE" cx="480" cy="0" r="5" fill="#64B5F6"/><text x="492" y="4" fill="#aebdce">IMAGE</text>
  </g>
</svg>
