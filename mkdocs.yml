  - 00 시작하기:
      - 00 시작하기: 00-getting-started/README.md
      - 설치: 00-getting-started/installation.md
      - 모델 준비: 00-getting-started/models.md
      - 캔버스 다루기: 00-getting-started/canvas-basics.md
      - 5분 빠른 시작: 00-getting-started/quick-start.md
      - 노드 다루기: 00-getting-started/node-basics.md
      - 실행과 중단: 00-getting-started/run-and-stop.md
      - 워크플로우 이해: 00-getting-started/workflow-basics.md
      - 프롬프트와 CLIP: 00-getting-started/prompt-basics.md
      - 첫 워크플로우 만들기: 00-getting-started/first-workflow.md
      - 저장과 재현: 00-getting-started/save-and-reproduce.md
  - 01 핵심 개념:
