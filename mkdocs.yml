site_name: Diffusion Research & ComfyUI Guide
site_description: 원리와 실습을 연결하는 한국어 Diffusion·ComfyUI 온라인 학습서
site_url: https://strangeimage.xyz/
repo_url: https://github.com/devmyungduk/diffusion-research
repo_name: devmyungduk/diffusion-research
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  language: ko
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: pink
      toggle:
        icon: material/weather-night
        name: 어두운 화면으로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: pink
      toggle:
        icon: material/weather-sunny
        name: 밝은 화면으로 전환

plugins:
  - search:
      # 공백·하이픈만 나누면 `strength_model`, `(개념:1.5)` 같은 토큰이 통째로 묶인다.
      # 밑줄·괄호·콜론과 CamelCase 경계까지 나눠 노드·위젯 이름을 검색할 수 있게 한다.
      separator: '[\s\-,:!=\[\]()"`/_]+|\.(?!\d)|(?!\b)(?=[A-Z][a-z])'
      lang:
        - ko
        - en

  # 링크를 공유할 때 페이지별 미리보기 카드(og:image)를 만든다.
  # 기본 폰트 Roboto에는 한글 글리프가 없어 Noto Sans KR을 지정한다.
  - social:
      cards_layout_options:
        font_family: Noto Sans KR

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - markdown.extensions.toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  # 용어 사전 정의를 모든 문서에 약어로 붙인다. 본문 용어에 마우스를 올리면
  # 정의가 그 자리에 뜨므로 용어 사전 페이지로 이동하지 않는다.
  - pymdownx.snippets:
      base_path: [.]
      auto_append:
        - includes/glossary-abbr.md
  - pymdownx.mark
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/glossary-tooltip.js
  - javascripts/nav-sections.js

nav:
